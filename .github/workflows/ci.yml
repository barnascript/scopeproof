name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built server
        run: |
          DB_FILE=/tmp/smoke.db PORT=4100 node dist/server/index.js &
          for i in $(seq 1 20); do curl -fs localhost:4100/api/health && break; sleep 0.5; done
          curl -fs localhost:4100/api/projects | grep -q "Tutor booking app"
          curl -fs localhost:4100/ | grep -q "<div id=\"root\">"
