services:
  - type: web
    name: scopeproof
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /tmp/scopeproof.db
      # Optional. Any OpenAI-style chat API works (OpenAI, Groq, OpenRouter).
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_BASE_URL
        sync: false
